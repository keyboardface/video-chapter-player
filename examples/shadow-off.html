<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>video-chapter — shadowDom: false (escape hatch)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; background: #f5f5f5; }
  h1 { color: #5b21b6; }

  /* With shadowDom: false, every internal selector is reachable from the
     host page. Player CSS is injected late and has class-level specificity,
     so deep overrides either need:
     (a) a tiny bit of extra specificity — e.g. add `.chapter-player-instance`
         to the selector (the player adds this class to the host); or
     (b) `!important` for the simplest 1-liner. */
  .video-chapter-player.chapter-player-instance .chapter-list {
    background: linear-gradient(180deg, #ede9fe 0%, #ddd6fe 100%);
    border: 1px solid #c4b5fd;
  }
  .video-chapter-player .chapter-item.active {
    background-color: #7c3aed !important;
    border-color: #5b21b6 !important;
  }
  .video-chapter-player.chapter-player-instance .video-controls-custom {
    background: linear-gradient(180deg, rgba(91,33,182,0.2) 0%, rgba(91,33,182,0.85) 100%);
  }
  .video-chapter-player .segment-progress { background-color: #7c3aed !important; box-shadow: 0 0 4px rgba(124,58,237,0.5) !important; }
</style>
</head>
<body>
<h1>Escape hatch: <code>shadowDom: false</code></h1>
<p>Same player, but rendered in light DOM. Host-page CSS now reaches the internal <code>.chapter-list</code>, <code>.chapter-item.active</code>, and <code>.video-controls-custom</code> selectors for purple theming.</p>

<div class="video-chapter-player" data-config="{'shadowDom': false,'videoUrl': 'https://assets.cdn.filesafe.space/uhcbimOZnVDulC9iuZGJ/media/69dd1d35ef1dbfe76e026194.mp4','chapterListTitle': 'Chapters','chapters': [{'id': '1','timestamp': 0,'title': 'Opening'},{'id': '2','timestamp': 15,'title': 'Big Buck appears'},{'id': '3','timestamp': 45,'title': 'Forest scene'},{'id': '4','timestamp': 90,'title': 'Action begins'},{'id': '5','timestamp': 180,'title': 'Climax'}]}"></div>

<script src="../embed.js"></script>
</body>
</html>
