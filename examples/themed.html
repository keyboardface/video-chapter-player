<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>video-chapter — themed (CSS variables, shadow DOM on)</title>
<style>
  body { font-family: 'Poppins', system-ui, sans-serif; background: #161616; color: #fff; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
  h1 { color: #ff6b00; }
  /* Theme the player to match the GHL Customizer page palette.
     These vars pierce the shadow DOM via inheritance — no JS, no shadowDom: false. */
  .video-chapter-player {
    --vcp-progress: #ff6b00;
    --vcp-progress-hover: #ff8a2e;
    --vcp-chapter-item-active-bg: #ff6b00;
    --vcp-chapter-item-active-text: #fff;
    --vcp-speed-active: #ffa659;
    --vcp-controls-text: #ffd9b8;
    --vcp-controls-text-hover: #ffffff;
    --vcp-chapter-list-bg: #1f1f1f;
    --vcp-chapter-item-bg: #2a2a2a;
    --vcp-chapter-title: #ffa659;
    --vcp-radius: 16px;
    --vcp-font: 'Poppins', system-ui, sans-serif;
  }
</style>
</head>
<body>
<h1>Themed via CSS variables (shadow DOM still on)</h1>
<p>Orange progress bar, orange active chapter, dark chapter list — all from host-page CSS vars piercing the shadow boundary.</p>

<div class="video-chapter-player" data-config="{'videoUrl': 'https://assets.cdn.filesafe.space/uhcbimOZnVDulC9iuZGJ/media/69dd1d35ef1dbfe76e026194.mp4','chapterListTitle': 'Chapters','chapters': [{'id': '1','timestamp': 0,'title': 'Opening'},{'id': '2','timestamp': 15,'title': 'Big Buck appears'},{'id': '3','timestamp': 45,'title': 'Forest scene'},{'id': '4','timestamp': 90,'title': 'Action begins'},{'id': '5','timestamp': 180,'title': 'Climax'}]}"></div>

<script src="../embed.js"></script>
</body>
</html>
